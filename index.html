<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="A simple PWA for hands-free PDF page turning." />
    <title>PDF Page Turner</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img src="icons/icon.svg" alt="" class="brand-icon" />
          <div>
            <h1>PDF Page Turner</h1>
            <p id="documentName">No PDF loaded</p>
          </div>
        </div>
        <button class="install-button hidden" id="installButton" type="button">Install</button>
      </header>

      <section class="viewer-panel" aria-label="PDF viewer">
        <div class="tap-zone tap-zone-left" id="previousZone" aria-label="Previous page"></div>
        <div class="tap-zone tap-zone-right" id="nextZone" aria-label="Next page"></div>

        <div class="empty-state" id="emptyState">
          <div class="empty-mark">PDF</div>
          <h2>Import a PDF to begin</h2>
          <p>Tap the left or right side of the screen to turn pages.</p>
          <button class="restore-button hidden" id="restoreButton" type="button">Restore Last PDF</button>
          <label class="primary-file-button">
            Import PDF
            <input id="fileInput" type="file" accept="application/pdf,.pdf" />
          </label>
        </div>

        <div class="loading-state hidden" id="loadingState">
          <div class="loader"></div>
          <p>Loading PDF...</p>
        </div>

        <canvas id="pdfCanvas" class="pdf-canvas" aria-label="Current PDF page"></canvas>
      </section>

      <section class="controls" aria-label="PDF controls">
        <div class="page-controls">
          <button class="icon-button" id="previousButton" type="button" aria-label="Previous page" title="Previous page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6" /></svg>
          </button>
          <div class="page-status" id="pageStatus">Page 0 / 0</div>
          <button class="icon-button" id="nextButton" type="button" aria-label="Next page" title="Next page">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
          </button>
        </div>

        <div class="timing-grid">
          <label class="field">
            <span>Default interval</span>
            <div class="input-with-unit">
              <input id="defaultInterval" type="number" min="0.5" step="0.5" inputmode="decimal" />
              <span>sec</span>
            </div>
          </label>

          <label class="field">
            <span>This page</span>
            <div class="input-with-unit">
              <input id="pageInterval" type="number" min="0.5" step="0.5" inputmode="decimal" placeholder="Default" />
              <span>sec</span>
            </div>
          </label>

          <button class="secondary-button" id="savePageTiming" type="button">Save Page Time</button>
          <button class="ghost-button" id="clearPageTiming" type="button">Use Default</button>
        </div>

        <div class="auto-controls">
          <button class="primary-button" id="startPauseButton" type="button">Start Auto Turn</button>
          <button class="ghost-button" id="fullscreenButton" type="button">Fullscreen</button>
          <label class="file-button">
            Change PDF
            <input id="secondaryFileInput" type="file" accept="application/pdf,.pdf" />
          </label>
        </div>
      </section>
    </main>
  </body>
</html>
